name: pre-release and publish

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  gates:
    uses: ./.github/workflows/dotnet.yml
    with:
      run_performance: true

  stress-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ipax77/Sc2DirectStrike
          ref: 40ab4b950443b510bb4144c7e23f6c524c3b7299
          path: stress-corpus
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore s2protocol.NET.tests/s2protocol.NET.tests.csproj
      - name: Decode all 30 pinned replays with bounded parallelism
        env:
          S2PROTOCOL_RUN_STRESS_TESTS: '1'
          S2PROTOCOL_BENCHMARK_REPLAY_DIR: ${{ github.workspace }}/stress-corpus/src/Sc2DirectStrike.Tests/testdata
        run: >-
          dotnet test s2protocol.NET.tests/s2protocol.NET.tests.csproj
          --configuration Release --no-restore
          --filter FullyQualifiedName~StressReplayTests

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [gates, stress-corpus]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate exact release tag
        shell: pwsh
        run: ./eng/validate-version.ps1 -Tag '${{ github.ref_name }}'
      - uses: actions/download-artifact@v6
        with:
          name: nuget-packages
          path: artifacts
      - name: Publish packages and symbols to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in artifacts/*.nupkg artifacts/*.snupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
      - name: Create GitHub release with validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' artifacts/*.nupkg artifacts/*.snupkg --verify-tag --generate-notes
